- name: Evaluate Namespace {{ threescale_project }}
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    api_version: v1
    kind: Namespace
    name: '{{ threescale_project }}'
    state: present

- name: Evaluate 3scale Operator
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    resource_definition: "{{ lookup('template', '3scale-operator.yml.j2') }}"

- name: Wait 3scale Operator
  kubernetes.core.k8s_info:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    api_version: v1
    kind: Pod
    namespace: '{{ threescale_project }}'
    label_selectors:
      - app = 3scale-api-management
      - control-plane = controller-manager
    field_selectors:
      - status.phase=Running
  register: threescale_r_operator_pod
  retries: 20
  delay: 10
  until: threescale_r_operator_pod.resources | list | length == 1

- name: Install Minio
  ansible.builtin.include_role:
    name: minio

- name: Install Valkey
  ansible.builtin.include_role:
    name: valkey

- name: Evaluate db keys
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    namespace: '{{ threescale_project }}'
    resource_definition: "{{ lookup('file', item) }}"
  loop:
    - system-database-secret.yml
    - zync-secret.yml

- name: Evaluate Zync database
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    namespace: '{{ threescale_project }}'
    resource_definition: "{{ lookup('template', 'postgresdb.yml.j2') }}"
  vars:
    database_name: zync_production
    service_name: zync

- name: Waiting for Zync Postgresdb instance to be running
  kubernetes.core.k8s_info:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    api_version: v1
    kind: Pod
    namespace: '{{ threescale_project }}'
    label_selectors:
      - app = zync-postgresql-db
      - statefulset.kubernetes.io/pod-name = zync-postgresql-db-0
    field_selectors:
      - status.phase=Running
  register: r_minio_pod
  retries: 20
  delay: 10
  until: r_minio_pod.resources | list | length == 1

- name: Evaluate System database
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    namespace: '{{ threescale_project }}'
    resource_definition: "{{ lookup('template', 'postgresdb.yml.j2') }}"
  vars:
    database_name: system
    service_name: system

- name: Waiting for System Postgresdb instance to be running
  kubernetes.core.k8s_info:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    api_version: v1
    kind: Pod
    namespace: '{{ threescale_project }}'
    label_selectors:
      - app = system-postgresql-db
      - statefulset.kubernetes.io/pod-name = system-postgresql-db-0
    field_selectors:
      - status.phase=Running
  register: r_minio_pod
  retries: 20
  delay: 10
  until: r_minio_pod.resources | list | length == 1

- name: Evaluate 3scale Operator s3-secret
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    resource_definition: "{{ lookup('template', 's3-secret.yml.j2') }}"

- name: Evaluate 3scale APIManager
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    resource_definition: "{{ lookup('template', '3scale-instance.yml.j2') }}"

- name: Wait for 3scale pods to be ready
  kubernetes.core.k8s_info:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    api_version: apps.3scale.net/v1alpha1
    kind: APIManager
    namespace: '{{ threescale_project }}'
    name: example-apimanager
  register: threescale_api_m
  until:
    - threescale_api_m is defined
    - threescale_api_m.resources[0].status.deployments.ready[10] is defined
  retries: 20
  delay: 30

- name: Evaluate UAT Tenant Secret
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    resource_definition: "{{ lookup('template', 'uat_admin_secret.yml.j2') }}"

- name: Evaluate UAT Tenant
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: false
    state: present
    resource_definition: "{{ lookup('template', 'uat_tenant.yml.j2') }}"
