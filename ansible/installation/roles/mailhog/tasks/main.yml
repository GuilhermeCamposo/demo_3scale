- name: Evaluate namespace {{ mailhog_ns }}
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: '{{ verify_tls }}'
    api_version: v1
    kind: Namespace
    name: '{{ mailhog_ns }}'
    state: present

- name: Evaluate Mailhog Manifests
  kubernetes.core.k8s:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: '{{ verify_tls }}'
    state: present
    namespace: '{{ mailhog_ns }}'
    resource_definition: "{{ lookup('file', item) }}"
  with_items:
    - deployment.yml
    - svc.yml
    - route.yml

- name: Wait Mailhog Instance
  kubernetes.core.k8s_info:
    api_key: '{{ token }}'
    host: '{{ server }}'
    validate_certs: '{{ verify_tls }}'
    api_version: v1
    kind: Pod
    namespace: '{{ mailhog_ns }}'
    label_selectors:
      - deployment = mailhog
    field_selectors:
      - status.phase=Running
  register: r_mailhog_pod
  retries: 20
  delay: 10
  until: r_mailhog_pod.resources | list | length == 1
