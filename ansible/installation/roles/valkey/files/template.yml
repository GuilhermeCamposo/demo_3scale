apiVersion: v1
items:
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app: valkey
      app.kubernetes.io/component: valkey
      app.kubernetes.io/instance: valkey
      app.kubernetes.io/name: valkey
      app.kubernetes.io/part-of: valkey-app
      app.openshift.io/runtime-version: 7.2.11
    name: valkey
  spec:
    ports:
    - name: 6379-tcp
      port: 6379
      protocol: TCP
      targetPort: 6379
    selector:
      app: valkey
      deployment: valkey
    sessionAffinity: None
    type: ClusterIP

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app: valkey
      app.kubernetes.io/component: valkey
      app.kubernetes.io/instance: valkey
      app.kubernetes.io/name: valkey
      app.kubernetes.io/part-of: valkey-app
      app.openshift.io/runtime-namespace: demo-3scale
    name: valkey
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: valkey
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app: valkey
          deployment: valkey
      spec:
        containers:
        - image: valkey/valkey:7.2.11
          imagePullPolicy: IfNotPresent
          name: valkey
          ports:
          - containerPort: 6379
            protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /data
            name: valkey-1
        dnsPolicy: ClusterFirst
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30
        volumes:
        - emptyDir: {}
          name: valkey-1
kind: List
metadata:
  resourceVersion: ""
